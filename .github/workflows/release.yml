name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      extension_version: ${{ steps.ver.outputs.extension_version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      image_tags: ${{ steps.ver.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Fail unless tag vX.Y.Z matches pyproject.toml
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Unexpected tag format: $TAG (expected vX.Y.Z)"; exit 1 ;;
          esac
          EXPECTED="${TAG#v}"
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$EXPECTED" != "$PY_VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $PY_VERSION (expected v$PY_VERSION)"
            exit 1
          fi
          echo "version=$PY_VERSION" >> "$GITHUB_OUTPUT"
          python3 - <<'PYVER'
          import os, re, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          match = re.fullmatch(r'(\d+\.\d+\.\d+)(rc\d+)?', version)
          if not match:
              raise SystemExit('Expected X.Y.Z or X.Y.ZrcN')
          prerelease = bool(match.group(2))
          image = 'ghcr.io/phate334/vscode-revealjs-server'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'extension_version={match.group(1)}\n')
              out.write(f'prerelease={str(prerelease).lower()}\n')
              out.write('image_tags<<TAGS\n')
              out.write(f'{image}:{version}\n')
              if not prerelease:
                  out.write(f'{image}:latest\n')
              out.write('TAGS\n')
          PYVER

  package-vsix:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Sync extension/package.json version
        env:
          VERSION: ${{ needs.verify-version.outputs.extension_version }}
        run: |
          python3 -c "
          import json, os
          path = 'extension/package.json'
          with open(path) as f:
              pkg = json.load(f)
          pkg['version'] = os.environ['VERSION']
          with open(path, 'w') as f:
              json.dump(pkg, f, indent=2)
              f.write('\n')
          print(f\"extension/package.json version -> {pkg['version']}\")
          "
      - name: Build VSIX
        working-directory: extension
        run: |
          npm ci
          npm run compile
          FLAGS=()
          if [ "${{ needs.verify-version.outputs.prerelease }}" = "true" ]; then FLAGS+=(--pre-release); fi
          npx --yes @vscode/vsce package "${FLAGS[@]}" --out "vscode-revealjs-collaboration-${{ needs.verify-version.outputs.version }}.vsix"
      - name: Create GitHub Release and upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          files: extension/vscode-revealjs-collaboration-${{ needs.verify-version.outputs.version }}.vsix
          generate_release_notes: true
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}

  docker:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.verify-version.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
