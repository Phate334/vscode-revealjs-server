[project]
name = "vscode-revealjs-server"
version = "0.1.0"
description = "FastAPI server for Reveal.js presentations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vscode-revealjs-server = "vscode_revealjs_server:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
