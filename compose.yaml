services:
  server:
    # Keep tag in sync with pyproject.toml [project].version (see AGENTS.md Releases).
    image: ghcr.io/phate334/vscode-revealjs-server:0.1.2
    ports:
      - "8000:8000"
    volumes:
      # Optional persistence for CRDT + project workspaces across restarts
      - ./.data:/app/.data
    environment:
      COLLAB_DATA_DIR: /app/.data/collaboration
      PROJECTS_DATA_DIR: /app/.data/projects
      # Optional. Empty starts with no accounts; username:password pairs only seed missing users.
      AUTH_DEMO_USER: ${AUTH_DEMO_USER:-}
      # AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
